name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "public/dashboard/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_run:
    workflows: ["Update market data"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Stage the dashboard as the site root
        run: |
          rm -rf _site
          cp -r public/dashboard _site
          cp public/favicon.ico _site/favicon.ico 2>/dev/null || true
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/funds.html
          test -f _site/data/summary.json
          test -f _site/data/funds.json
          echo "staged files: $(find _site -type f | wc -l)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
