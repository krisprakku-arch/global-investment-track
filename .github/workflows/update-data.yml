name: Update market data

on:
  schedule:
    - cron: "0 22 * * 0-5"    # 05:00 Bangkok (Sun-Fri UTC)
    - cron: "0 2 * * 1-6"     # 09:00 Bangkok (Mon-Sat UTC)
    - cron: "0 5 * * 1-6"     # 12:00 Bangkok (Mon-Sat UTC)
    - cron: "0 8 * * 1-6"     # 15:00 Bangkok (Mon-Sat UTC)
    - cron: "0 11 * * 1-6"    # 18:00 Bangkok (Mon-Sat UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/update_data.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/dashboard/data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update market data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
